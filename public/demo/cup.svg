<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Blue collapsible silicone cup with lid and lanyard on a white background">
  <defs>
    <linearGradient id="band" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#3f6fd1"/>
      <stop offset="0.35" stop-color="#6a95ef"/>
      <stop offset="0.6" stop-color="#5b87e6"/>
      <stop offset="1" stop-color="#3a64c0"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#cbd5e1"/>
      <stop offset="0.4" stop-color="#f1f5f9"/>
      <stop offset="1" stop-color="#b8c4d4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="#ffffff"/>
  <ellipse cx="400" cy="700" rx="200" ry="22" fill="#0f172a" opacity="0.07"/>
  <!-- lanyard -->
  <path d="M590 265 C 690 250, 720 380, 640 430 C 600 455, 585 420, 600 395" fill="none" stroke="#64748b" stroke-width="9" stroke-linecap="round"/>
  <!-- base -->
  <path d="M245 520 L555 520 L540 668 Q538 690 515 690 L285 690 Q262 690 260 668 Z" fill="url(#band)"/>
  <ellipse cx="400" cy="520" rx="155" ry="20" fill="#2f5bb8"/>
  <!-- ring 3 -->
  <path d="M232 430 L568 430 L555 520 L245 520 Z" fill="url(#band)"/>
  <ellipse cx="400" cy="430" rx="168" ry="22" fill="#2f5bb8"/>
  <!-- ring 2 -->
  <path d="M218 340 L582 340 L568 430 L232 430 Z" fill="url(#band)"/>
  <ellipse cx="400" cy="340" rx="182" ry="24" fill="#2f5bb8"/>
  <!-- ring 1 -->
  <path d="M205 262 L595 262 L582 340 L218 340 Z" fill="url(#band)"/>
  <!-- highlight -->
  <path d="M270 285 L262 650" stroke="#ffffff" stroke-opacity="0.35" stroke-width="16" stroke-linecap="round"/>
  <!-- lid -->
  <ellipse cx="400" cy="262" rx="198" ry="34" fill="url(#lid)"/>
  <ellipse cx="400" cy="252" rx="182" ry="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
  <rect x="455" y="232" width="70" height="22" rx="11" fill="#cbd5e1"/>
  <circle cx="595" cy="262" r="12" fill="#94a3b8"/>
</svg>
