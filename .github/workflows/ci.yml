name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Everything runs in mock mode: no secrets needed, deterministic, free.
env:
  AI_MODE: mock
  DATA_MODE: memory
  BILLING_MODE: mock
  RAG_MODE: lexical

jobs:
  check:
    name: Lint, types, tests, evals, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Ownership (workstream branches may only touch their folders)
        if: github.event_name == 'pull_request'
        run: node scripts/check-ownership.mjs --base origin/${{ github.base_ref }} --branch ${{ github.head_ref }}
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Evals (mock mode, ship threshold 80%)
        run: pnpm eval
      - run: pnpm build

  e2e:
    name: Playwright smoke test
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
